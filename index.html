<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NestJS 生命周期教程 — 启动与请求双阶段概念详解</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230e7490'/%3E%3Cpath d='M16 8l8 16h-4l-1.6-3.2h-4.8L16 8z' fill='%23e0f2fe'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #060a14;
      --panel: #0f1728;
      --panel-2: #131e31;
      --line: #22304a;
      --text: #e6edf7;
      --muted: #7d8aa3;
      --accent: #22d3ee;
      --accent-strong: #67e8f9;
      --accent-soft: #0e7490;
      --warn: #f59e0b;
      --warn-strong: #fbbf24;
      --err: #ef4444;
      --drawer-w: 60vw;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    /* ===== 竖屏横屏提示 ===== */
    .landscape-tip { display: none; }
    @media (max-aspect-ratio: 1/1) {
      .landscape-tip { display: flex; }
      /* 主内容保持渲染（提示层覆盖其上），避免 SVG 在 display:none 下初始化失败导致动画/点击失效 */
    }
    .landscape-tip {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg);1
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    }
    .landscape-tip .tip-icon { width: 64px; height: 64px; color: var(--muted); stroke-width: 1.6; }
    .landscape-tip p { color: var(--muted); font-size: 16px; }

    /* ===== 主布局 ===== */
    .main-wrap { width: 100%; height: 100%; display: flex; flex-direction: column; }
    header {
      height: 52px; flex: 0 0 auto;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; border-bottom: 1px solid var(--line);
    }
    header h1 { font-size: 15px; font-weight: 600; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .stage-badge { display: flex; align-items: center; gap: 14px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text); }
    .badge .dot { width: 9px; height: 9px; border-radius: 50%; }
    .badge .dot.la { background: #67e8f9; box-shadow: 0 0 8px rgba(34,211,238,.6); }
    .badge .dot.lb { background: #fbbf24; box-shadow: 0 0 8px rgba(245,158,11,.6); }
    .toolbar { display: flex; gap: 10px; }
    .toolbar button {
      padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 13px; transition: background .2s ease;
    }
    #btnCtrl { background: var(--accent-soft); color: #fff; min-width: 64px; }
    #btnCtrl:hover { background: var(--accent); color: #062a3a; }

    /* ===== 画布 + 抽屉（60%） ===== */
    .stage { flex: 1; display: flex; min-width: 0; overflow: hidden; }

    /* ===== 代码演示面板（打字机）：>1000px 左右分栏，≤1000px 上下分栏 ===== */
    .work { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .code-demo {
      flex: 0 0 auto; height: clamp(150px, 38vh, 300px);
      background: var(--panel); border-top: 1px solid var(--line);
      padding: 10px 16px 12px; display: flex; flex-direction: column; min-height: 0;
    }
    .code-head { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .cd-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .cd-file {
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px;
      color: var(--accent-strong); background: rgba(34,211,238,.08);
      border: 1px solid rgba(34,211,238,.3); padding: 2px 8px; border-radius: 5px;
    }
    .cd-stage { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 1px; }
    .cd-step { font-size: 13px; color: var(--text); font-weight: 600; line-height: 1.4; }
    .cd-code {
      flex: 1; margin: 0; overflow: auto; white-space: pre;
      scrollbar-gutter: stable;
      background: #0b1120; border: 1px solid #1e293b; border-radius: 8px;
      padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 12.5px; line-height: 1.55; color: #d7e2f4;
    }
    .cd-caret { color: var(--accent); animation: cdBlink 1s steps(1) infinite; }
    .cd-code span { transition: color .45s ease; }
    .cd-cur { color: #fde047; font-weight: 600; animation: cdFade .5s ease; }
    @keyframes cdFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes cdBlink { 50% { opacity: 0; } }
    @media (min-width: 1000px) {
      .work { flex-direction: row; }
      .code-demo { flex: 0 0 460px; width: 460px; height: auto; border-top: none; border-left: 1px solid var(--line); }
    }
    /* 抽屉展开后：动画与代码演示改为上下布局；代码面板铺满宽度 */
    .work.open-drawer { flex-direction: column; }
    .work.open-drawer .code-demo {
      flex: 0 0 auto; width: 100%; height: clamp(150px, 38vh, 300px);
      border-top: 1px solid var(--line); border-left: none;
    }
    .svg-wrap {
      width: 100%; min-width: 0;
      display: flex; flex-direction: column;
      padding: 14px 14px 6px;
      transition: width .5s cubic-bezier(.22,1,.36,1);
    }
    .stage.open .svg-wrap { width: calc(100% - var(--drawer-w)); }
    .svg-wrap .pipeline-svg { flex: 1; min-height: 0; width: 100%; }
    .svg-wrap .data-rail { flex: 0 0 auto; margin-top: 8px; }

    .drawer {
      width: 0; flex-shrink: 0; overflow: hidden;
      transition: width .5s cubic-bezier(.22,1,.36,1);
    }
    .stage.open .drawer { width: var(--drawer-w); }
    .drawer-inner {
      width: var(--drawer-w); height: 100%;
      background: var(--panel); border-left: 1px solid var(--line);
      padding: 20px; overflow-y: auto;
    }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .drawer-head h2 { font-size: 18px; font-weight: 700; }
    .drawer-close {
      background: none; border: none; color: var(--muted);
      font-size: 24px; cursor: pointer; line-height: 1; transition: color .2s;
    }
    .drawer-close:hover { color: var(--text); }
    .drawer-body { color: var(--muted); font-size: 14px; line-height: 1.7; }
    .drawer-body .placeholder {
      border: 1px dashed var(--line); border-radius: 8px;
      padding: 14px; margin: 12px 0; color: #64748b; font-size: 13px;
    }

    /* ===== 抽屉详情排版 ===== */
    .d-tag {
      display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 1px;
      padding: 2px 10px; border-radius: 999px; margin-bottom: 12px;
    }
    .d-tag.a { color: #67e8f9; background: rgba(34,211,238,.08); border: 1px solid rgba(34,211,238,.4); }
    .d-tag.b { color: #fbbf24; background: rgba(245,158,11,.08); border: 1px solid rgba(245,158,11,.4); }
    .d-tag.err { color: #fde047; background: rgba(250,204,21,.08); border: 1px solid rgba(250,204,21,.5); }
    .d-sec { margin: 16px 0 20px; }
    .d-sec h3 {
      font-size: 13px; font-weight: 700; color: var(--text);
      margin: 0 0 8px; display: flex; align-items: center; gap: 7px;
    }
    .d-sec h3::before { content: ''; width: 10px; height: 10px; border-radius: 3px; background: var(--accent-soft); }
    .d-sec p { margin: 0; color: #b6c2d9; font-size: 13.5px; }
    .d-sec pre {
      margin: 0; padding: 12px 14px; border-radius: 8px;
      background: #0b1120; border: 1px solid #1e293b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px; line-height: 1.6; color: #d7e2f4;
      overflow-x: auto; white-space: pre;
    }
    .d-sec ul { margin: 0; padding-left: 18px; color: #b6c2d9; font-size: 13.5px; }
    .d-sec li { margin: 6px 0; }
    .d-sec li strong { color: #e2e8f0; font-weight: 600; }

    /* ===== SVG ===== */
    .app-label { fill: var(--accent); font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .app-sub { fill: var(--muted); font-size: 10.5px; letter-spacing: 1px; }

    /* 平滑 S 连接线段：A 启动（青） / B 请求（橙） */
    .seg-line { fill: none; stroke-width: 2.5; transition: all .25s ease; }
    .seg-line.a { stroke: rgba(34,211,238,.4); }
    .seg-line.b { stroke: rgba(245,158,11,.4); }
    .seg-line.a.on { stroke: var(--accent-strong); filter: drop-shadow(0 0 6px rgba(34,211,238,.8)); }
    .seg-line.b.on { stroke: var(--warn-strong); filter: drop-shadow(0 0 6px rgba(245,158,11,.8)); }
    .filter-line { stroke: rgba(250,204,21,.55); stroke-width: 1.8; fill: none; stroke-dasharray: 6 6; opacity: .55; }

    .ring-node { cursor: pointer; }
    .ring-node .ring {
      fill: var(--panel-2); stroke: var(--muted); stroke-width: 2;
      stroke-dasharray: 7 7; opacity: .55;
      transition: all .25s ease;
    }
    .ring-node:hover .ring { stroke: var(--accent); opacity: .85; }
    .ring-node .name { fill: var(--text); font-weight: 600; text-anchor: middle; }
    .ring-node .role { fill: var(--muted); text-anchor: middle; }
    .ring-node.lv1 .name { font-size: 16px; }
    .ring-node.lv1 .role { font-size: 11px; }
    .ring-node.lv2 .name { font-size: 14px; }
    .ring-node.lv2 .role { font-size: 10px; }
    .ring-node.lv3 .name { font-size: 12px; }
    .ring-node.lv3 .role { font-size: 9px; }

    /* 阶段常驻色 */
    .ring-node.stage-a .ring { stroke: rgba(34,211,238,.55); }
    .ring-node.stage-b .ring { stroke: rgba(245,158,11,.55); }
    .ring-node.stage-a.final .name { fill: #67e8f9; }
    .ring-node.branch .ring { stroke-dasharray: 6 6; stroke: rgba(250,204,21,.6); }
    .ring-node.branch .name { fill: #fde047; }
    .ring-node.branch .role { fill: rgba(253,224,71,.7); }

    /* 进入（激活）高亮 */
    .ring-node.stage-a.active .ring { stroke: var(--accent-strong); stroke-width: 3; stroke-dasharray: none; opacity: 1; }
    .ring-node.stage-a.active .name { fill: var(--accent-strong); }
    .ring-node.stage-a.active .role { fill: var(--accent-strong); }
    .ring-node.stage-a.active { filter: drop-shadow(0 0 14px rgba(34,211,238,.7)); }
    .ring-node.stage-b.active .ring { stroke: var(--warn-strong); stroke-width: 3; stroke-dasharray: none; opacity: 1; }
    .ring-node.stage-b.active .name { fill: var(--warn-strong); }
    .ring-node.stage-b.active .role { fill: var(--warn-strong); }
    .ring-node.stage-b.active { filter: drop-shadow(0 0 14px rgba(245,158,11,.7)); }
    .ring-node.branch.active .ring { stroke: #fde047; stroke-width: 3; stroke-dasharray: none; opacity: 1; }
    .ring-node.branch.active .name { fill: #fde047; }
    .ring-node.branch.active .role { fill: #fde047; }
    .ring-node.branch.active { filter: drop-shadow(0 0 14px rgba(250,204,21,.7)); }

    .ring-node.selected .ring { stroke: #ffffff; stroke-width: 3; stroke-dasharray: none; opacity: 1; }
    .ring-node.selected .name { fill: #ffffff; }
    .ring-node.selected .role { fill: #cbd5e1; }
    .ring-node.selected { filter: drop-shadow(0 0 14px rgba(255,255,255,.5)); }

    /* 核心概念（Module / Controller / Service）：专属紫色（仅常驻标识，高亮回归阶段色） */
    .ring-node.core .ring { stroke: rgba(167,139,250,.6); }
    .ring-node.core .name { fill: #c4b5fd; }
    .ring-node.core .role { fill: rgba(196,181,253,.72); }
    .ring-node.core.selected .ring { stroke: #ffffff; }
    .ring-node.core.selected .name { fill: #ffffff; }

    .packet-trail { opacity: .4; }
    .packet-trail-2 { opacity: .16; }
    .packet-trail-3 { opacity: .07; }

    /* 数据形态胶囊：A 青 / B 橙 */
    /* 数据形态条：两段胶囊（启动阶段 / 请求阶段），纯点样式 */
    .rail { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .rail-group { display: flex; align-items: center; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .cap {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 7px; border-radius: 999px;
      background: var(--panel-2); border: 1px solid var(--line);
      transition: all .3s ease;
    }
    .cap .dot { width: 6px; height: 6px; border-radius: 50%; background: #475569; transition: background .3s; }
    .cap.a { border-color: rgba(34,211,238,.45); }
    .cap.b { border-color: rgba(245,158,11,.45); }
    .cap.a.on { background: rgba(34,211,238,.12); border-color: var(--accent); color: var(--accent); }
    .cap.a.on .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .cap.b.on { background: rgba(245,158,11,.12); border-color: var(--warn); color: var(--warn); }
    .cap.b.on .dot { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
    .cap.branch { border-style: dashed; border-color: rgba(250,204,21,.5); }
    .cap.branch.on { border-color: #fde047; color: #fde047; background: rgba(250,204,21,.12); }
    .cap.branch.on .dot { background: #fde047; box-shadow: 0 0 8px rgba(250,204,21,.8); }

    @media (prefers-reduced-motion: reduce) {
      .packet-glow { animation: none; }
      .packet-trail, .packet-trail-2, .packet-trail-3 { opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- 竖屏横屏提示 -->
  <div class="landscape-tip" role="alert">
    <svg class="tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <rect x="3" y="6" width="18" height="12" rx="2"/>
      <path d="M12 3v3M12 18v3M3 12H1M23 12h-2"/>
    </svg>
    <p>请将设备横屏查看</p>
  </div>

  <div class="main-wrap">
    <header>
      <h1>NestJS 生命周期</h1>
      <div class="header-right">
        <div class="stage-badge">
          <span class="badge"><span class="dot la"></span>启动阶段</span>
          <span class="badge"><span class="dot lb"></span>请求阶段</span>
        </div>
        <div class="toolbar">
          <button id="btnCtrl" type="button">暂停</button>
        </div>
      </div>
    </header>

    <div class="work" id="work">
    <div id="stage" class="stage">
      <div id="svgWrap" class="svg-wrap">
        <svg class="pipeline-svg" viewBox="0 0 900 900" preserveAspectRatio="xMidYMid meet"
             aria-label="NestJS 生命周期：平滑 S 曲线串联启动与请求阶段">

          <!-- 数据包（顶层） -->
          <circle id="pkt3" class="packet-trail-3" r="6" fill="#22d3ee" />
          <circle id="pkt2" class="packet-trail-2" r="8" fill="#22d3ee" />
          <circle id="pkt1" class="packet-trail" r="10" fill="#22d3ee" />

          <!-- ===== 平滑连接线段：A 段（青） / B 段（橙），折弯处三次贝塞尔 ===== -->
          <path class="seg-line a" id="s0"  d="M172,150 L260,150" />
          <path class="seg-line a" id="s1"  d="M340,150 L416,150" />
          <path class="seg-line a" id="s2"  d="M544,150 L620,150" />
          <path class="seg-line a" id="s3"  d="M700,150 L800,150" />
          <path class="seg-line a" id="s4"  d="M868,178 C900,178 900,363 877,363" />
          <path class="seg-line b" id="s5"  d="M788,400 L700,400" />
          <path class="seg-line b" id="s6"  d="M608,400 L520,400" />
          <path class="seg-line b" id="s7"  d="M440,400 L340,400" />
          <path class="seg-line b" id="s8"  d="M260,400 L160,400" />
          <path class="seg-line b" id="s9"  d="M92,428 C60,428 60,622 92,622" />
          <path class="seg-line b" id="s10" d="M160,650 L236,650" />
          <path class="seg-line b" id="s11" d="M364,650 L416,650" />
          <path class="seg-line b" id="s12" d="M544,650 L620,650" />
          <path class="seg-line b" id="s13" d="M700,650 L788,650" />

          <!-- ===== A 启动阶段（Row1 左→右 + Row2 右端） ===== -->
          <g class="ring-node lv2 stage-a" data-idx="100" data-cap="0" transform="translate(120,150)">
            <circle class="ring" r="52" />
            <text class="name" y="-4">AppModule</text>
            <text class="role" y="20">根模块 · 应用图起点</text>
          </g>
          <g class="ring-node lv3 stage-a" data-idx="101" data-cap="1" transform="translate(300,150)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">imports</text>
            <text class="role" y="16">递归加载 Module</text>
          </g>
          <g class="ring-node lv1 core stage-a" data-idx="102" data-cap="2" transform="translate(480,150)">
            <circle class="ring" r="64" />
            <text class="name" y="-6">Module</text>
            <text class="role" y="26">扫描元数据并声明</text>
          </g>
          <g class="ring-node lv3 stage-a" data-idx="103" data-cap="3" transform="translate(660,150)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">实例化 Provider</text>
            <text class="role" y="16">构建 DI 容器</text>
          </g>
          <g class="ring-node lv3 stage-a" data-idx="104" data-cap="4" transform="translate(840,150)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">注册路由</text>
            <text class="role" y="16">@Controller / @Get</text>
          </g>
          <g class="ring-node lv2 final stage-a" data-idx="105" data-cap="5" transform="translate(840,400)">
            <circle class="ring" r="52" />
            <text class="name" y="-4">应用就绪</text>
            <text class="role" y="20">可接收请求</text>
          </g>

          <!-- ===== B 请求阶段（Row2 右→左 + Row3 左→右） ===== -->
          <g class="ring-node lv2 stage-b" data-idx="0" data-cap="10" transform="translate(660,400)">
            <circle class="ring" r="52" />
            <text class="name" y="-4">Request</text>
            <text class="role" y="20">外部进入</text>
          </g>
          <g class="ring-node lv3 stage-b" data-idx="1" data-cap="11" transform="translate(480,400)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">Middleware</text>
            <text class="role" y="16">透传 · 增强</text>
          </g>
          <g class="ring-node lv3 stage-b" data-idx="2" data-cap="12" transform="translate(300,400)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">Guard</text>
            <text class="role" y="16">鉴权 · 上下文</text>
          </g>
          <g class="ring-node lv3 stage-b" data-idx="3" data-cap="13" transform="translate(120,400)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">Interceptor</text>
            <text class="role" y="16">前置 · 拦截</text>
          </g>
          <g class="ring-node lv3 stage-b" data-idx="4" data-cap="14" transform="translate(120,650)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">Pipe</text>
            <text class="role" y="16">校验 · 转 DTO</text>
          </g>
          <g class="ring-node lv1 core stage-b" data-idx="5" data-cap="15" transform="translate(300,650)">
            <circle class="ring" r="64" />
            <text class="name" y="-6">Controller</text>
            <text class="role" y="26">路由分配</text>
          </g>
          <g class="ring-node lv1 core stage-b" data-idx="6" data-cap="16" transform="translate(480,650)">
            <circle class="ring" r="64" />
            <text class="name" y="-6">Service</text>
            <text class="role" y="26">业务逻辑</text>
          </g>
          <g class="ring-node lv3 stage-b" data-idx="7" data-cap="17" transform="translate(660,650)">
            <circle class="ring" r="40" />
            <text class="name" y="-3">Interceptor</text>
            <text class="role" y="16">后置 · 包装</text>
          </g>
          <g class="ring-node lv2 stage-b" data-idx="9" data-cap="18" transform="translate(840,650)">
            <circle class="ring" r="52" />
            <text class="name" y="-4">Response</text>
            <text class="role" y="20">返回客户端</text>
          </g>

          <!-- 异常兜底：ExceptionFilter（红色虚线分支，挂在返回段） -->
          <path class="filter-line" d="M660,696 L660,758" />
          <g class="ring-node lv3 branch" data-idx="8" data-cap="19" transform="translate(660,800)">
            <circle class="ring" r="40" />
            <text class="name" y="-7" font-size="10">Exception</text>
            <text class="name" y="9" font-size="10">Filter</text>
            <text class="role" y="24">异常兜底</text>
          </g>
        </svg>
      </div>

      var segEls = [];

      var SEG_LEN = [];

      function measureTrack() {
        var lens = [], sum = 0;
        for (var i = 0; i < 14; i++) {
          var l;

          lens.push(l);
          sum += l;
        }
        SEG_LEN = lens;
        TRACK_LEN = sum;
        BOUNDS = [0];
        var acc = 0;
        lens.forEach(function (x) { acc += x; BOUNDS.push(acc); });
        return true;
      }
      var trackReady = measureTrack();
      if (!trackReady) {

          if (measureTrack()) return;

        { node: 1,   cap: 11 }, // 7  Middleware
        { node: 2,   cap: 12 }, // 8  Guard
        { node: 3,   cap: 13 }, // 9  Interceptor 前置
        { node: 4,   cap: 14 }, // 10 Pipe
        { node: 5,   cap: 15 }, // 11 Controller
        { node: 6,   cap: 16 }, // 12 Service
        { node: 7,   cap: 17 }, // 13 Interceptor 后置
        { node: 9,   cap: 18 }  // 14 Response

      var segIds = ['s0','s1','s2','s3','s4','s5','s6','s7','s8','s9','s10','s11','s12','s13'];

      var progress = 0;

      function pointAt(prog) {
        var q = ((prog % 1) + 1) % 1;
        var len = q * TRACK_LEN;
        var idx = 0;
        for (var k = 0; k < 14; k++) {
          if (len >= BOUNDS[k] && len < BOUNDS[k + 1]) { idx = k; break; }

        var segLen = segEls[idx].getTotalLength();
        var p = segEls[idx].getPointAtLength(len - BOUNDS[idx]);
        return { x: p.x, y: p.y, idx: idx, t: segLen ? (len - BOUNDS[idx]) / segLen : 0 };
      }

        el.setAttribute('cy', p.y.toFixed(1));

          code: '// 标准返回（推荐）\n@Get()\nfindAll() { return []; }        // → 200，JSON []\n\n// 库特定方式（谨慎使用）\n@Get()\nfindAll(@Res() res: Response) {\n  res.status(HttpStatus.OK).json([]);\n}',
          notes: [

          code: '@Catch(HttpException)\nexport class HttpExceptionFilter implements ExceptionFilter {\n  catch(exception: HttpException, host: ArgumentsHost) {\n    const ctx = host.switchToHttp();\n    const response = ctx.getResponse();\n    response.status(exception.getStatus()).json({\n      statusCode: exception.getStatus(),\n      timestamp: new Date().toISOString(),\n      path: ctx.getRequest().url,\n    });\n  }\n}\n// 绑定：@UseFilters(...) / app.useGlobalFilters() / APP_FILTER',

            { label: '在模块 configure() 中绑定', lines: ['// 消费模块 implements NestModule：', '// configure(consumer: MiddlewareConsumer) {', '//   consumer.apply(LoggerMiddleware).forRoutes("cats");', '// }'] }

            { label: '按角色放行 / 拒绝', lines: ['    const { user } = context.switchToHttp().getRequest();', '    return matchRoles(roles, user.roles);', '  }', '}'] }

            { label: '校验失败抛异常（handler 不执行）', lines: ['    if (isNaN(val)) throw new BadRequestException("Validation failed");', '    return val;', '  }', '}'] }

            { label: '控制器前缀 + 注入 Service', lines: ['@Controller("cats")', 'export class CatsController {', '  constructor(private catsService: CatsService) {}'] },
            { label: '接收请求并调用 Service', lines: ['  @Post()', '  create(@Body() dto: CreateCatDto) {', '    return this.catsService.create(dto);', '  }', '}'] }

            { label: '数据存取（状态封装）', lines: ['  create(cat: Cat) { this.cats.push(cat); }', '  findAll(): Cat[] { return this.cats; }', '}'] }

            { label: '响应侧拦截（后置包装）', lines: ['@Injectable()', 'export class TransformInterceptor implements NestInterceptor {', '  intercept(context: ExecutionContext, next: CallHandler): Observable<any> {'] },
            { label: 'map 操作符包装响应体', lines: ['    return next.handle().pipe(map(data => ({ data })));', '  }', '}'] }
          ]

          file: 'cats.controller.ts',
          steps: [

            { label: '标准返回：自动序列化 JSON', lines: ['@Controller("cats")', 'export class CatsController {', '  @Get()', '  findAll() { return []; }', '}'] },
            { label: '库特定响应（谨慎使用）', lines: ['// 或显式使用 @Res 接管响应：', 'findAll(@Res() res: Response) {', '  res.status(HttpStatus.OK).json([]);', '}'] }
          ]

      // 兜底：未在 DEMO 中定义的节点，直接用 DETAILS.code 按行打字
      function getDemo(node) {
        if (DEMO[node]) return DEMO[node];
        var d = DETAILS[node];
        var lines = d ? d.code.split('\n') : ['// 暂无代码示例'];
        var file = lines[0].replace(/^\/\/\s*/, '').trim() || 'NestJS 概念';
        return { file: file, steps: [{ label: (d && d.tagLabel) || '', lines: lines }] };
      }

      var cdFile = document.getElementById('cdFile');
      var cdStage = document.getElementById('cdStage');
      var cdStep = document.getElementById('cdStep');
      var cdCode = document.getElementById('cdCode');
      var caretEl = document.createElement('span');
      caretEl.className = 'cd-caret';
      caretEl.textContent = '▍';

      // 打字机状态：按步骤分块输出（每步一次打出全部代码行），
      // 当前步骤代码高亮，下一步输出时上一步恢复普通颜色
      var typer = { node: -1, step: 0, done: false, pauseUntil: 0, stepPause: 700 };

      function updateStepLabel(d) {
        cdStep.textContent = '步骤 ' + (typer.step + 1) + '/' + d.steps.length + ' · ' + d.steps[typer.step].label;
      }

      // 渲染：只显示「已完成步骤 + 当前步骤」的行；新步骤的行追加出现并高亮
      function renderStep(d) {
        // 上一步的高亮先取消（颜色过渡回普通色）
        var old = cdCode.getElementsByClassName('cd-cur');
        for (var i = 0; i < old.length; i++) old[i].classList.remove('cd-cur');
        var st = d.steps[typer.step];
        var frag = document.createDocumentFragment();
        for (var l = 0; l < st.lines.length; l++) {
          if (typer.step > 0 || l > 0) frag.appendChild(document.createTextNode('\n'));
          var sp = document.createElement('span');
          sp.textContent = st.lines[l];
          sp.className = 'cd-cur';
          frag.appendChild(sp);
        }
        cdCode.insertBefore(frag, caretEl);
        // 自动跟随滚动到底部：确保新输出的高亮代码始终可见，不被遮挡
        cdCode.scrollTop = cdCode.scrollHeight;
      }

      function typeTick(idx, dt, now) {
        var node = map[idx].node;
        if (node !== typer.node) {
          typer.node = node;
          typer.step = 0; typer.done = false; typer.pauseUntil = 0;
          var d0 = getDemo(node);
          cdFile.textContent = d0.file;
          cdStage.textContent = (DETAILS[node] && DETAILS[node].tagLabel) || '';
          updateStepLabel(d0);
          // 步骤停留时间自适应：让全部步骤在当前段时长内展示完（350–900ms/步）
          var segDur = (BOUNDS[idx + 1] - BOUNDS[idx]) / TRACK_LEN * DURATION; // 当前段时长 ms
          var pauses = d0.steps.length * 90;
          typer.stepPause = Math.max(350, Math.min(900, (segDur - pauses) / d0.steps.length));
          cdCode.textContent = '';
          cdCode.appendChild(caretEl);
          renderStep(d0);
          typer.done = d0.steps.length === 1;
          typer.pauseUntil = now + typer.stepPause;
          return;
        }
        if (typer.done) return;
        if (now < typer.pauseUntil) return;
        var d = getDemo(node);
        if (typer.step + 1 >= d.steps.length) { typer.done = true; return; }
        typer.step += 1;
        updateStepLabel(d);
        renderStep(d);
        typer.pauseUntil = now + typer.stepPause;
      }

      function setSelected(di) {
        selected = di;
        nodes.forEach(function (n) {
          var ni = parseInt(n.getAttribute('data-idx'), 10);
          n.classList.toggle('selected', ni === di);
          if (ni !== di) n.classList.remove('active');
        });
        var node = nodes.filter(function (n) {
          return parseInt(n.getAttribute('data-idx'), 10) === di;
        })[0];
        setCaps(parseInt(node.getAttribute('data-cap'), 10));
      }

      // 段间休息：每个动画阶段完成时停顿 300ms，留出阅读代码的反应时间
      var SEG_REST = 300;
      var segRest = { on: false, until: 0 };

      function step(ts) {
        if (!last) last = ts;
        var dt = Math.min(50, ts - last);
        last = ts;
        if (playing && selected < 0) {
          if (segRest.on) {
            if (ts >= segRest.until) segRest.on = false;
            // 休息期间不更新画面：pkt 停留在上一段完成位置，代码保持完整显示
          } else {
            var np = progress + dt / DURATION;
            if (np > 1) np -= 1;
            if (pointAt(np).idx !== pointAt(progress).idx) {
              // 跨段：立即推进到新段起点（避免重复触发休息死循环），
              // 画面暂不更新以保持上一段完成态，停顿 SEG_REST 后正常进入新段
              progress = np;
              segRest.on = true;
              segRest.until = ts + SEG_REST;
            } else {
              progress = np;
              var p = pointAt(progress);
              place(pkt1, p);
              highlightStage(p.idx, p.t);
              typeTick(p.idx, dt, ts);
            }
          }
        }
        place(pkt1, pointAt(progress));
        place(pkt2, pointAt(progress - 0.015));
        place(pkt3, pointAt(progress - 0.03));
        requestAnimationFrame(step);
      }

      function openDrawer(di) {
        playing = false;
        btnState = 'play';
        setBtn('播放');
        stage.classList.add('open');
        document.getElementById('work').classList.add('open-drawer');
        drawer.setAttribute('aria-hidden', 'false');
        var node = nodes.filter(function (n) {
          return parseInt(n.getAttribute('data-idx'), 10) === di;
        })[0];
        var title = node.querySelector('.name').textContent;
        if (title === 'Exception') title = 'ExceptionFilter';
        drawerTitle.textContent = title;
        drawerBody.innerHTML = renderDetail(DETAILS[di]);
        setSelected(di);
      }

      function closeDrawer() {
        stage.classList.remove('open');
        document.getElementById('work').classList.remove('open-drawer');
        drawer.setAttribute('aria-hidden', 'true');
        selected = -1;
        clearHighlights();
        playing = true;
        btnState = 'pause';
        setBtn('暂停');
      }

      function setBtn(label) { document.getElementById('btnCtrl').textContent = label; }

      // 单按钮两态，文字与播放状态严格同步：
      //   播放中 →「暂停」→ 点击暂停；已暂停 →「播放」→ 点击恢复
      function handleBtn() {
        if (stage.classList.contains('open')) { closeDrawer(); return; }
        if (btnState === 'pause') {
          playing = false;
          btnState = 'play';
          setBtn('播放');
        } else {
          playing = true;
          btnState = 'pause';
          setBtn('暂停');
        }
      }

      nodes.forEach(function (node) {
        node.addEventListener('click', function () {
          openDrawer(parseInt(node.getAttribute('data-idx'), 10));
        });
      });
      closeBtn.addEventListener('click', closeDrawer);
      document.getElementById('btnCtrl').addEventListener('click', handleBtn);

      // 转屏 / 窗口尺寸变化后重新测量轨道长度（兜底先竖屏后横屏的场景）
      window.addEventListener('resize', function () { measureTrack(); });

      requestAnimationFrame(step);
    })();
  </script>
